name: Test ve Vercel yayın

# main'e her push'ta: lint + typecheck + unit test + build, geçerse Vercel'e production yayını.
# Tarayıcı (Playwright/Lighthouse) testleri burada koşmaz; Claude yerelde yapar.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_IWBdFFE1yrN06w4L0BQxK1Cz
  VERCEL_PROJECT_ID: prj_4nr3Qeu05CcoMgDXt7MeAfnflyPp
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test-ve-yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: ffmpeg (video testleri için)
        timeout-minutes: 6
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then ffmpeg -version | head -1; exit 0; fi
          if curl -fsSL --retry 3 --max-time 150 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz \
            && tar -xJf /tmp/ff.tar.xz -C /tmp; then
            sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/
          else
            sudo apt-get install -y -qq --no-install-recommends ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
          fi
          ffmpeg -version | head -1
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --testTimeout=30000
      - name: Vercel ayarlarını çek
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@65.0.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Vercel build
        if: env.VERCEL_TOKEN != ''
        env:
          ASSET_SKIP_REENCODE: "1"
        run: npx --yes vercel@65.0.0 build --prod --token="$VERCEL_TOKEN" || (echo "::warning::Derleme yeniden deneniyor (geçici ağ/font hatası)"; sleep 20; npx --yes vercel@65.0.0 build --prod --token="$VERCEL_TOKEN")
      - name: Vercel production yayını
        if: env.VERCEL_TOKEN != ''
        # Hobby ekibinde commit yazarı üye değilse yayın TEAM_ACCESS_REQUIRED ile bloklanır;
        # git meta verisini göndermeden token sahibi adına yayınla (yalnız CI makinesindeki kopya).
        run: |
          rm -rf .git
          npx --yes vercel@65.0.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Token yok uyarısı
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::VERCEL_TOKEN secret tanımlı değil; testler geçti ama yayın atlandı."
