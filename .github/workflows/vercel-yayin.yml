name: Test ve build (API yayını ayrı)

# main push: lint + typecheck + unit + build. Production yayını yalnız doğrulanmış Vercel REST API ile.
# Tarayıcı (Playwright/Lighthouse) testleri burada koşmaz; Claude yerelde yapar.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: afina-verification
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  dogrulama:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: ffmpeg (video testleri için)
        timeout-minutes: 6
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2 --testTimeout=30000
      - name: Production build
        env:
          ASSET_SKIP_REENCODE: "1"
        run: npm run build
